# Check every PR and every push to main. A green push to main is a release: version 0.2.<n>
# (version.json plus the commits since it last changed), tagged v0.2.<n>, with the blueprint
# attached as kiln-blueprint-<version>.zip. main is squash-merge only, so each merged PR is one release.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs cancel superseded runs on the same branch; every commit on main runs to completion.
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the patch number counts commits
      - name: Work out the version
        run: |
          since=$(git log -1 --format=%H -- version.json)
          patch=$(( $(git rev-list --count "$since..HEAD") + 1 ))
          echo "VERSION=$(jq -r .version version.json).$patch" >> "$GITHUB_ENV"
      - name: Zip the blueprint
        run: |
          mkdir -p dist
          (cd claude-plugin/blueprint && zip -r "../../dist/kiln-blueprint-$VERSION.zip" .)
      # Checks before it acts, so a re-run finishes a partial release without failing.
      - name: Create the tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" "dist/kiln-blueprint-$VERSION.zip" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
