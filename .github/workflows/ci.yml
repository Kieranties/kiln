# Check and package every PR and every push to main. A green push to main is a release:
# nbgv versions it from version.json and the git height, and a GitHub Release carries the
# kit as kiln-kit-<version>.zip.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs cancel superseded runs on the same branch; every commit on main runs to completion.
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nbgv counts the git height
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6 # nbgv runs on .NET
        with:
          dotnet-version: 10.x
      - run: npm ci
      - name: Stamp the version
        id: version
        run: |
          npx nbgv-setversion
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Zip the kit
        run: |
          mkdir -p dist
          (cd kit && zip -r "../dist/kiln-kit-${{ steps.version.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: kit
          path: dist/kiln-kit-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.package.outputs.version }}
      ZIP: kiln-kit-${{ needs.package.outputs.version }}.zip
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kit
      # Checks before it acts, so a re-run finishes a partial release without failing.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" "$ZIP" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi
